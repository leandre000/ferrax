services:
  carhubconnect_backend:
    build: .
    ports:
      - 5020:5020
    environment:
      - MONGO_URI=mongodb://mongodb:27017/carhub_db
    depends_on:
      - mongodb
  mongodb:
    image: mongo:latest
    ports:
      - 27017:27017
    volumes:
      - mongodb_data:/data/db
volumes:
  mongodb_data: